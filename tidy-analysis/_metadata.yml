# Options shared by every analysis in this folder

# Outputs are re-computed only when you render a post explicitly
freeze: true

author: "Arun Koundinya Parasa"
output-file: index.html
title-block-banner: false

toc: true
toc-depth: 3
toc-title: "On this page"
code-tools: false
code-copy: true

# Adds the dataset / tools strip under the title and the end-of-post block
filters:
  - ../_filters/tt-meta.lua

comments:
  giscus:
    repo: ArunKoundinya/TidyTuesday
    repo-id: R_kgDOLS-XzA
    category: General
    category-id: DIC_kwDOLS-XzM4CdbG7
    mapping: pathname
    reactions-enabled: true
    input-position: bottom
    theme: light
    language: en
