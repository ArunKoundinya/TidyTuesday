project:
  type: website
  render:
    - "*.qmd"
    - "tidy-analysis/*/*.qmd"
  resources:
    - assets/subscribe.js
    - images/logo-mark.png          # used by the subscriber emails
    - images/apple-touch-icon.png   # linked by scripts/seo.py
  post-render:
    - scripts/seo.py
    - scripts/subscribe_box.py

website:
  title: "Tidy Tuesday"
  site-url: https://arunkoundinya.github.io/TidyTuesday/
  description: "Arun Koundinya Parasa's solutions to the weekly TidyTuesday data challenge: charts, maps, animations and a dashboard in R and Python, with the code for each."
  favicon: images/favicon.png
  open-graph: true
  twitter-card: true
  image: images/social-card.png
  navbar:
    logo: images/logo-mark.svg
    logo-alt: "Tidy Tuesday by Arun Koundinya"
    left:
      - text: Gallery
        href: gallery.qmd
      - text: All weeks
        href: gallery.qmd#all-weeks
      - text: About
        href: about.qmd
      - text: Subscribe
        href: index.qmd#h-subscribe
    right:
      - icon: rss
        href: index.xml
        aria-label: RSS
      - icon: github
        href: https://github.com/ArunKoundinya/TidyTuesday
        aria-label: GitHub
      - icon: linkedin
        href: https://www.linkedin.com/in/arunkoundinya0710/
        aria-label: LinkedIn

  page-footer:
    left: "&copy; 2023 – 2026 [Arun Koundinya Parasa](https://arunkoundinya.github.io/) · Also: [Canvass And Analyze](https://arunkoundinya.github.io/CanvassAndAnalyze/) · [AI Basics with AK](https://arunkoundinya.github.io/AIBasicswithAK/) · [Deep Learning](https://arunkoundinya.github.io/DeepLearning/)"
    right: "Built with 💚 and [Quarto](https://quarto.org/). Data from [#TidyTuesday](https://github.com/rfordatascience/tidytuesday)."

format:
  html:
    theme: [cosmo, theme.scss]
    css: styles.css
    include-in-header: _seo-head.html
    toc: true
    grid:
      body-width: 860px
